<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecha - Asistente Virtual</title>

  <!-- Script oficial de Dialogflow ES Messenger -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

  <style>
    /* Reset base */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4edf7;
      font-family: Roboto, sans-serif;
      overflow: hidden;
    }

    /* Contenedor Principal en Pantalla Completa */
    .caja-mecha-premium {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 9999 !important;
    }

    /* Estructura Nactiva Dialogflow ES */
    df-messenger {
      width: 100% !important;
      height: 100% !important;
      --df-messenger-button-titlebar-color: #8E24AA;
      --df-messenger-chat-window-height: 100vh;
      --df-messenger-chat-window-width: 100vw;
      --df-messenger-font-color: #2c2c2c;
      font-family: Roboto, sans-serif !important;
    }

    /* Ventana de chat a pantalla completa */
    df-messenger ::part(chat-window) {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
    }

    /* Encabezado (Barra de Título Violeta) */
    df-messenger ::part(titlebar) {
      background-color: #8E24AA !important;
      color: #ffffff !important;
    }

    /* Ocultar botón flotante de apertura */
    df-messenger ::part(launcher),
    df-messenger ::part(chat-bubble) {
      display: none !important;
    }

    /* Preservar saltos de línea en el texto */
    df-messenger ::part(message) {
      white-space: pre-wrap !important;
      word-break: break-word !important;
    }

    /* Centrado de Botones (Chips) */
    df-messenger ::part(chips) {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      flex-wrap: wrap !important;
      width: 100% !important;
      margin: 10px 0 !important;
    }

    df-messenger ::part(chip) {
      display: inline-flex !important;
      justify-content: center !important;
      align-items: center !important;
      margin: 4px !important;
      background-color: #ffffff !important;
      border: 1px solid #dcdcdc !important;
      border-radius: 18px !important;
    }
  </style>
</head>
<body>

  <div class="caja-mecha-premium">
    <df-messenger
      intent="WELCOME"
      chat-title="Mecha"
      agent-id="e0dbe63b-3c93-40ad-9c32-efd39b5f4fc3"
      language-code="es"
      expand="true">
    </df-messenger>
  </div>

  <script>
    /* Ajuste quirúrgico puntual únicamente para elementos de texto y chips dinámicos */
    function aplicarAjustesPuntuales() {
      var df = document.querySelector('df-messenger');
      if (!df || !df.shadowRoot) return;

      var dfChat = df.shadowRoot.querySelector('df-messenger-chat');
      if (!dfChat || !dfChat.shadowRoot) return;

      var dfMsgList = dfChat.shadowRoot.querySelector('df-message-list');
      if (!dfMsgList || !dfMsgList.shadowRoot) return;

      var styleId = 'mecha-fix-clean';
      if (!dfMsgList.shadowRoot.querySelector('#' + styleId)) {
        var style = document.createElement('style');
        style.id = styleId;
        style.textContent = [
          '.message { white-space: pre-wrap !important; word-break: break-word !important; }',
          'df-chips, .df-chips-wrapper { display: flex !important; justify-content: center !important; flex-wrap: wrap !important; width: 100% !important; }'
        ].join('\n');
        dfMsgList.shadowRoot.appendChild(style);
      }
    }

    window.addEventListener('dfMessengerLoaded', aplicarAjustesPuntuales);
    [300, 1000, 2500].forEach(function(ms) {
      setTimeout(aplicarAjustesPuntuales, ms);
    });
  </script>

</body>
</html>
