<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecha - Asistente Virtual</title>

  <!-- Script oficial de Dialogflow ES Messenger -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

  <style>
    /* Reset de marco */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4edf7;
      font-family: Roboto, sans-serif;
      overflow: hidden;
    }

    .caja-mecha-premium {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
    }

    df-messenger {
      width: 100% !important;
      height: 100% !important;
      --df-messenger-button-titlebar-color: #8E24AA;
    }
  </style>
</head>
<body>

  <div class="caja-mecha-premium">
    <df-messenger
      intent="WELCOME"
      chat-title="Mecha"
      agent-id="e0dbe63b-3c93-40ad-9c32-efd39b5f4fc3"
      language-code="es"
      expand="true">
    </df-messenger>
  </div>

  <script>
    function inyectarCSS(root, id, css) {
      if (!root || root.querySelector('#' + id)) return;
      var style = document.createElement('style');
      style.id = id;
      style.textContent = css;
      try { root.appendChild(style); } catch (e) {}
    }

    function fijarEstructuraEspecifica() {
      var df = document.querySelector('df-messenger');
      if (!df || !df.shadowRoot) return;

      // Nivel 1: Forzar ventana a pantalla completa y ocultar launcher flotante
      inyectarCSS(df.shadowRoot, 'fix-nivel-1', [
        'df-messenger-chat { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; max-height: 100vh !important; border-radius: 0 !important; }',
        'df-messenger-chat-bubble, #widgetIcon, button.chat-bubble { display: none !important; opacity: 0 !important; pointer-events: none !important; }'
      ].join('\n'));

      // Nivel 2: Expandir contenedor interno del chat y fijar encabezado violeta
      var dfChat = df.shadowRoot.querySelector('df-messenger-chat');
      if (!dfChat || !dfChat.shadowRoot) return;

      inyectarCSS(dfChat.shadowRoot, 'fix-nivel-2', [
        '.chat-wrapper, .chat-window, .wrapper { width: 100% !important; height: 100% !important; max-height: 100% !important; border-radius: 0 !important; box-shadow: none !important; }',
        'df-messenger-titlebar { background-color: #8E24AA !important; }',
        'df-message-list { flex: 1 1 auto !important; height: 100% !important; }'
      ].join('\n'));

      // Nivel 3: Formato de saltos de línea y centrado de botones (sin alterar burbujas de texto)
      var dfMsgList = dfChat.shadowRoot.querySelector('df-message-list');
      if (!dfMsgList || !dfMsgList.shadowRoot) return;

      inyectarCSS(dfMsgList.shadowRoot, 'fix-nivel-3', [
        '.message { white-space: pre-wrap !important; word-break: break-word !important; }',
        'df-chips, .df-chips-wrapper { display: flex !important; justify-content: center !important; flex-wrap: wrap !important; width: 100% !important; margin: 8px 0 !important; }'
      ].join('\n'));
    }

    // Ejecución controlada tras la carga del componente
    window.addEventListener('dfMessengerLoaded', fijarEstructuraEspecifica);
    
    var observer = new MutationObserver(fijarEstructuraEspecifica);
    observer.observe(document.body, { childList: true, subtree: true });

    [200, 600, 1500, 3000].forEach(function(ms) {
      setTimeout(fijarEstructuraEspecifica, ms);
    });
  </script>

</body>
</html>
