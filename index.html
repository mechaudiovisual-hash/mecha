<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecha - Asistente Virtual</title>

  <!-- Script oficial de Dialogflow ES Messenger (CDN Google, sin XSS) -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

  <style>
    /* --- Reset base -------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4edf7;
      font-family: Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* --- Marco Global ------------------------------------------------- */
    .caja-mecha-premium {
      position:        fixed   !important;
      top:             0       !important;
      left:            0       !important;
      width:           100vw   !important;
      height:          100vh   !important;
      margin:          0       !important;
      padding:         0       !important;
      max-width:       none    !important;
      border-radius:   0       !important;
      overflow:        hidden  !important;
      z-index:         9999    !important;
      box-shadow:      none    !important;
      display:         flex    !important;
      flex-direction:  column  !important;
      justify-content: center  !important;
      align-items:     center  !important;
    }

    /* 1. BLINDAJE DE LA VENTANA */
    df-messenger {
      --df-messenger-chat-window-height: 520px !important;
      --df-messenger-chat-window-width: 370px !important;
      --df-messenger-button-titlebar-color: #8E24AA !important;
      font-family: Roboto, sans-serif !important;
      line-height: normal !important;
    }

    /* 2. SCROLL INTERNO DE MENSAJES */
    df-messenger ::part(message-list) {
      max-height: 420px !important;
      overflow-y: auto !important;
      box-sizing: border-box !important;
    }

    /* 3. CHIPS - CENTRADO Y GEOMETRIA */
    df-messenger ::part(chip) {
      display:          inline-flex !important;
      align-items:      center !important;
      justify-content:  center !important;
      height:           36px !important;
      line-height:      1 !important;
      padding:          0 14px !important;
      margin:           4px !important;
      box-sizing:       border-box !important;
      vertical-align:   middle !important;
      background-color: #ffffff !important;
      border:           1px solid #dcdcdc !important;
    }

    /* 4. TEXTO DEL CHIP */
    df-messenger ::part(chip-text) {
      line-height:    1 !important;
      font-size:      14px !important;
      display:        inline-block !important;
      vertical-align: middle !important;
    }

    /* 5. ICONO DEL CHIP */
    df-messenger ::part(chip-icon) {
      margin-left: 6px !important;
      display:     inline-flex !important;
      align-items: center !important;
    }

    /* --- Ocultar launcher nativo -------------------------------------- */
    df-messenger::part(launcher),
    df-messenger-chat-bubble,
    df-messenger::part(chat-bubble) {
      display:        none    !important;
      visibility:     hidden  !important;
      opacity:        0       !important;
      pointer-events: none    !important;
      width:          0       !important;
      height:         0       !important;
      overflow:       hidden  !important;
    }

    /* --- Saltos de linea --------------------------------------------- */
    df-messenger::part(message) {
      white-space: pre-wrap !important;
      word-break:  break-word !important;
    }
  </style>
</head>
<body>

  <div class="caja-mecha-premium">
    <df-messenger
      intent="WELCOME"
      chat-title="Mecha"
      agent-id="e0dbe63b-3c93-40ad-9c32-efd39b5f4fc3"
      language-code="es"
      expand="true">
    </df-messenger>
  </div>

  <script>
    /* ================================================================
       PALETA
    ================================================================ */
    var V = { violeta: '#8E24AA', blanco: '#ffffff' };

    /* ================================================================
       CSS INYECTADO EN CADA NIVEL DEL SHADOW DOM
    ================================================================ */
    function generarCSS() {
      return [
        ':host {',
        '  --df-messenger-brand-color: #8E24AA !important;',
        '  --df-messenger-button-titlebar-color: #8E24AA !important;',
        '  --df-messenger-chat-window-width: 370px !important;',
        '  --df-messenger-chat-window-height: 520px !important;',
        '  font-family: Roboto, sans-serif !important;',
        '  line-height: normal !important;',
        '}',

        '.df-messenger-wrapper,',
        '.chat-wrapper,',
        '.chat-window,',
        '.messenger-container,',
        'df-messenger-chat {',
        '  width:      370px !important;',
        '  max-width:  370px !important;',
        '  height:     520px !important;',
        '  max-height: 520px !important;',
        '  position:   relative !important;',
        '  box-shadow: none !important;',
        '}',

        '[part="message-list"],',
        '#messageList,',
        'df-message-list,',
        '.message-list,',
        '.chat-body,',
        '.messages-container {',
        '  max-height: 420px !important;',
        '  overflow-y: auto !important;',
        '  box-sizing: border-box !important;',
        '}',

        '.message, div.message, .text-message, df-message, [part="message"] {',
        '  white-space: pre-wrap !important;',
        '}',

        'df-messenger-titlebar,',
        '[part="titlebar"],',
        '.df-messenger-titlebar,',
        '.title-wrapper,',
        '.header {',
        '  background:       #8E24AA !important;',
        '  background-color: #8E24AA !important;',
        '}',
        '.title, [part="title"], df-messenger-titlebar span, h1, h2, .agent-name {',
        '  color: #ffffff !important;',
        '}',
        'df-messenger-titlebar svg path, [part="close-icon"] {',
        '  fill:  #ffffff !important;',
        '  color: #ffffff !important;',
        '}',

        'df-messenger-input-box,',
        '.input-box-wrapper,',
        'input[type="text"],',
        'textarea,',
        'df-messenger-user-input {',
        '  width:     100% !important;',
        '  max-width: none !important;',
        '}',

        '[part="chip"],',
        'df-chip,',
        '.df-chip,',
        '.chip,',
        'df-messenger-button,',
        'button.df-messenger-button,',
        '.df-messenger-button,',
        'df-button,',
        '.df-button,',
        'a.df-button {',
        '  display:          inline-flex !important;',
        '  align-items:      center !important;',
        '  justify-content:  center !important;',
        '  height:           36px !important;',
        '  line-height:      1 !important;',
        '  padding:          0 14px !important;',
        '  margin:           4px !important;',
        '  box-sizing:       border-box !important;',
        '  vertical-align:   middle !important;',
        '  background-color: #ffffff !important;',
        '  border:           1px solid #dcdcdc !important;',
        '  border-radius:    18px !important;',
        '  text-decoration:  none !important;',
        '  cursor:           pointer !important;',
        '}',

        '[part="chip-text"],',
        '.df-chip-text,',
        '.chip-text,',
        '[part="chip"] span,',
        'df-chip span,',
        'df-button span,',
        'df-messenger-button span {',
        '  line-height:    1 !important;',
        '  font-size:      14px !important;',
        '  display:        inline-block !important;',
        '  vertical-align: middle !important;',
        '}',

        '[part="chip-icon"],',
        '.df-chip-icon,',
        '.chip-icon,',
        '[part="chip"] svg,',
        'df-chip svg,',
        'df-button svg,',
        'df-messenger-button svg {',
        '  margin-left:    6px !important;',
        '  display:        inline-flex !important;',
        '  align-items:    center !important;',
        '  vertical-align: middle !important;',
        '}',

        'df-messenger-chat-bubble,',
        '[part="chat-bubble"],',
        '[part="launcher"],',
        'button#widgetIcon,',
        'button.df-messenger-chat-bubble,',
        '.df-messenger-chat-bubble,',
        'button[class*="bubble"],',
        'button[class*="launcher"],',
        'button[class*="widget"] {',
        '  display:        none !important;',
        '  visibility:     hidden !important;',
        '  opacity:        0 !important;',
        '  pointer-events: none !important;',
        '  width:          0 !important;',
        '  height:         0 !important;',
        '  overflow:       hidden !important;',
        '}'
      ].join('\n');
    }

    function inyectar(root, id) {
      if (!root) return;
      if (root.querySelector && root.querySelector('#' + id)) return;
      var el = document.createElement('style');
      el.id = id;
      el.textContent = generarCSS();
      try { root.appendChild(el); } catch (e) {}
    }

    function aplicarEstilos() {
      var df = document.querySelector('df-messenger');
      if (!df) return;
      inyectar(df.shadowRoot, 'mecha-n1');
      if (!df.shadowRoot) return;
      var dfChat = df.shadowRoot.querySelector('df-messenger-chat');
      if (dfChat) {
        inyectar(dfChat.shadowRoot, 'mecha-n2');
        if (!dfChat.shadowRoot) return;
        var dfTitle = dfChat.shadowRoot.querySelector('df-messenger-titlebar');
        if (dfTitle) {
          inyectar(dfTitle.shadowRoot, 'mecha-n3');
          try {
            dfTitle.style.setProperty('background',       V.violeta, 'important');
            dfTitle.style.setProperty('background-color', V.violeta, 'important');
          } catch (e) {}
        }
        var dfInput = dfChat.shadowRoot.querySelector('df-messenger-user-input');
        if (dfInput) { inyectar(dfInput.shadowRoot, 'mecha-n4'); }
      }
    }

    function ocultarLauncher() {
      var df = document.querySelector('df-messenger');
      if (!df) return;
      var sels = [
        'df-messenger-chat-bubble', '[part="chat-bubble"]', '[part="launcher"]',
        'button#widgetIcon', '.df-messenger-chat-bubble',
        'button[class*="bubble"]', 'button[class*="launcher"]', 'button[class*="widget"]'
      ];
      [document, df, df.shadowRoot].forEach(function (root) {
        if (!root || !root.querySelectorAll) return;
        sels.forEach(function (sel) {
          try {
            root.querySelectorAll(sel).forEach(function (el) {
              el.style.cssText =
                'display:none!important;visibility:hidden!important;' +
                'opacity:0!important;pointer-events:none!important;' +
                'width:0!important;height:0!important;overflow:hidden!important;';
            });
          } catch (e) {}
        });
      });
    }

    /* ================================================================
       CSS PROFUNDO PARA SALTOS DE LINEA + CHIPS (inyectado en todos
       los shadow roots via inyectarEnTodosLosNiveles)
    ================================================================ */
    var CSS_LINEBREAKS = [
      '* { word-break: break-word !important; }',

      '.message-text, df-message-bubble, .df-message-bubble-content,',
      '.message, div.message, .text-message, df-message,',
      '[part="message"], .bot-message, .bot-message p, .response-text, p {',
      '  white-space: pre-wrap !important;',
      '  line-height: 1.5 !important;',
      '}',

      'df-messenger-titlebar, [part="titlebar"], .df-messenger-titlebar,',
      '.title-wrapper, .header {',
      '  flex-shrink: 0 !important;',
      '  height: auto !important;',
      '  min-height: 44px !important;',
      '}',

      '[part="message-list"], #messageList, df-message-list,',
      '.message-list, .chat-body, .messages-container {',
      '  max-height: 420px !important;',
      '  overflow-y: auto !important;',
      '  overflow-x: hidden !important;',
      '  box-sizing: border-box !important;',
      '}',

      '[part="chip"], df-chip, .df-chip, .chip,',
      'df-messenger-button, button.df-messenger-button,',
      '.df-messenger-button, df-button, .df-button, a.df-button {',
      '  display: inline-flex !important;',
      '  align-items: center !important;',
      '  justify-content: center !important;',
      '  height: 36px !important;',
      '  line-height: 1 !important;',
      '  padding: 0 14px !important;',
      '  margin: 4px !important;',
      '  box-sizing: border-box !important;',
      '  vertical-align: middle !important;',
      '  background-color: #ffffff !important;',
      '  border: 1px solid #dcdcdc !important;',
      '  border-radius: 18px !important;',
      '  text-decoration: none !important;',
      '  cursor: pointer !important;',
      '}',

      '[part="chip-text"], .df-chip-text, .chip-text,',
      '[part="chip"] span, df-chip span, df-button span, df-messenger-button span {',
      '  line-height: 1 !important;',
      '  font-size: 14px !important;',
      '  display: inline-block !important;',
      '  vertical-align: middle !important;',
      '}',

      '[part="chip-icon"], .df-chip-icon, .chip-icon,',
      '[part="chip"] svg, df-chip svg, df-button svg, df-messenger-button svg {',
      '  margin-left: 6px !important;',
      '  display: inline-flex !important;',
      '  align-items: center !important;',
      '  vertical-align: middle !important;',
      '}',

      'df-messenger-user-input, .input-area, .user-input-container {',
      '  flex-shrink: 0 !important;',
      '  height: auto !important;',
      '  min-height: 60px !important;',
      '  width: 100% !important;',
      '}'
    ].join('\n');

    function inyectarLinebreaks(shadowRoot, id) {
      if (!shadowRoot) return;
      if (shadowRoot.querySelector && shadowRoot.querySelector('#' + id)) return;
      var s = document.createElement('style');
      s.id = id;
      s.textContent = CSS_LINEBREAKS;
      try { shadowRoot.appendChild(s); } catch (e) {}
    }

    function inyectarEnTodosLosNiveles() {
      var df = document.querySelector('df-messenger');
      if (!df || !df.shadowRoot) return;
      inyectarLinebreaks(df.shadowRoot, 'lb-n1');
      var dfChat = df.shadowRoot.querySelector('df-messenger-chat');
      if (!dfChat || !dfChat.shadowRoot) return;
      inyectarLinebreaks(dfChat.shadowRoot, 'lb-n2');
      var dfMsgList = dfChat.shadowRoot.querySelector('df-message-list');
      if (dfMsgList && dfMsgList.shadowRoot) {
        inyectarLinebreaks(dfMsgList.shadowRoot, 'lb-msglist');
        dfMsgList.shadowRoot.querySelectorAll('*').forEach(function (el, i) {
          if (el.shadowRoot) { inyectarLinebreaks(el.shadowRoot, 'lb-sub-' + i); }
        });
      }
      var dfTitle = dfChat.shadowRoot.querySelector('df-messenger-titlebar');
      if (dfTitle && dfTitle.shadowRoot) {
        inyectarLinebreaks(dfTitle.shadowRoot, 'lb-title');
      }
    }

    /* ================================================================
       MUTATIONOBSERVER
    ================================================================ */
    function iniciarObserver() {
      var observer = new MutationObserver(function (mutations) {
        var hayNuevos = mutations.some(function (m) { return m.addedNodes.length > 0; });
        if (hayNuevos) {
          ocultarLauncher();
          aplicarEstilos();
          inyectarEnTodosLosNiveles();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    }

    window.addEventListener('dfMessengerLoaded', function () {
      aplicarEstilos();
      ocultarLauncher();
      inyectarEnTodosLosNiveles();
    });

    [200, 600, 1200, 2500, 4000].forEach(function (ms) {
      setTimeout(function () {
        aplicarEstilos();
        ocultarLauncher();
        inyectarEnTodosLosNiveles();
      }, ms);
    });

    iniciarObserver();
    inyectarEnTodosLosNiveles();
  </script>

</body>
</html>
