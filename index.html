<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecha - Asistente Virtual</title>

  <!-- Fuente Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <!-- Script oficial de Dialogflow ES Messenger (CDN Google, sin XSS) -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

  <style>
    /* ─── Reset base ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4edf7;
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ─── Marco Global en Pantalla Completa (Full Viewport) ─────────────
       Ocupa el 100% de la ventana de forma absoluta y fija.
       flex + column: cabecera arriba, lista en el medio, footer abajo.
    ──────────────────────────────────────────────────────────────────── */
    .caja-mecha-premium {
      position:       fixed  !important;
      top:            0      !important;
      left:           0      !important;
      width:          100vw  !important;
      height:         100vh  !important;
      margin:         0      !important;
      padding:        0      !important;
      max-width:      none   !important;
      border-radius:  0      !important;
      overflow:       hidden !important;
      z-index:        9999   !important;
      box-shadow:     none   !important;

      /* Estructura columnar: cabecera fija + lista scrollable + footer fijo */
      display:        flex            !important;
      flex-direction: column          !important;
    }

    /* ─── Web Component: ocupa todo el contenedor ───────────────────── */
    df-messenger {
      position: absolute !important;
      inset: 0           !important;
      width:  100%       !important;
      height: 100%       !important;

      /* Forzar también la estructura de columna internamente */
      display:        flex   !important;
      flex-direction: column !important;
      overflow:       hidden !important;

      /* Dimensiones internas del panel del chat */
      --df-messenger-chat-window-width:  100% !important;
      --df-messenger-chat-window-height: 100%;
      --df-messenger-button-titlebar-color: #f4edf7;

      /* Transparency del wrapper (oculta el background del launcher) */
      --df-messenger-shadow-wrapper-background: transparent;

      /* Color de marca — controla cabecera, chips y acentos */
      --df-messenger-brand-color:                    #8E44AD;

      /* Cabecera */
      --df-messenger-titlebar-background:            #8E44AD;
      --df-messenger-titlebar-font-color:            #ffffff;
      --df-messenger-titlebar-icon-color:            #ffffff;

      /* Burbujas del bot (lila suave, texto oscuro) */
      --df-messenger-message-bot-background:         #f0e5fc;
      --df-messenger-message-bot-font-color:         #2d0052;

      /* Burbujas del usuario (violeta, texto blanco) */
      --df-messenger-message-user-background:        #8E44AD;
      --df-messenger-message-user-font-color:        #ffffff;

      /* Fondo del área de mensajes */
      --df-messenger-chat-background-color:          #faf5ff;

      /* Barra de entrada de texto */
      --df-messenger-input-box-color:                #f3e8ff;
      --df-messenger-input-font-color:               #2d0052;
      --df-messenger-input-placeholder-font-color:   #9b7bb8;

      /* Botón de enviar */
      --df-messenger-send-icon:                      #8E44AD;

      /* Chips / sugerencias rápidas */
      --df-messenger-button-background:              #f0e5fc;
      --df-messenger-button-font-color:              #6C2D9E;
      --df-messenger-button-border:                  1px solid #8E44AD;

      /* Tipografía */
      --df-messenger-font-color:                     #2d0052;
      --df-messenger-font-family:                    'Roboto', sans-serif;
      font-family:                                   'Roboto', sans-serif !important;
    }

    /* ─── Estilo para ocultar el botón disparador nativo ─────────────── */
    df-messenger >>> .df-messenger-wrapper button#widgetIcon,
    df-messenger::part(launcher),
    df-messenger-chat-bubble,
    df-messenger::part(chat-bubble) {
      display:        none    !important;
      visibility:     hidden  !important;
      opacity:        0       !important;
      pointer-events: none    !important;
      width:          0       !important;
      height:         0       !important;
      overflow:       hidden  !important;
    }

    /* ─── Asegurar que el input de texto ocupe todo el ancho inferior ─ */
    df-messenger >>> df-messenger-user-input,
    df-messenger-user-input::part(input) {
      width: 100% !important;
      max-width: none !important;
    }
    
    df-messenger-chat {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* ─── Saltos de línea para el texto (Ajuste sin tocar JS) ────────── */
    df-messenger >>> .message, 
    df-messenger >>> div.message, 
    df-messenger >>> .text-message, 
    df-messenger >>> df-message, 
    df-messenger::part(message),
    df-messenger >>> .message-text,
    df-messenger >>> df-message-bubble,
    df-messenger >>> .df-message-bubble-content {
      white-space: pre-wrap !important;
      word-break: break-word !important;
    }

    /* ─── (1) Centrado estricto y envoltura de texto en los chips ─────
       Usa las pseudoclases nativas expuestas por Google (::part) para
       llegar a los chips desde fuera del Shadow DOM sin necesitar JS.
    ──────────────────────────────────────────────────────────────────── */
    df-messenger::part(chips) {
      display:         flex   !important;
      flex-wrap:       wrap   !important;
      justify-content: center !important;
      align-items:     center !important;
      text-align:      center !important;
    }

    df-messenger::part(chip) {
      display:         flex   !important;
      justify-content: center !important;
      align-items:     center !important;
      text-align:      center !important;
      font-family:     'Roboto', sans-serif !important;
      white-space:     normal      !important;
      word-break:      break-word  !important;
      max-width:       95%         !important;
      margin:          4px         !important;
    }

    /* ─── (2) Bloqueo de desplazamiento horizontal ────────────────────
       Aísla el ancho de los contenedores de mensajes para que los chips
       dinámicos nunca generen scrollbar horizontal ni muevan el marco.
    ──────────────────────────────────────────────────────────────────── */
    df-messenger::part(list),
    df-messenger::part(chat) {
      overflow-x: hidden !important;
      width:      100%   !important;
      max-width:  100%   !important;
    }

    /* ─── MEDIA QUERIES (Opcional, ya que es Full Screen por defecto) ── */

    @media (max-width: 480px) {
      .caja-mecha-premium {
        height: 100dvh !important; /* Ajuste para barras móviles */
      }
    }
  </style>
</head>
<body>

  <div class="caja-mecha-premium">
    <!--
      inline style repite las variables críticas para máxima especificidad.
      expand="true" = chat abierto desde el inicio, sin click previo.
    -->
    <df-messenger
      intent="WELCOME"
      chat-title="Mecha"
      agent-id="e0dbe63b-3c93-40ad-9c32-efd39b5f4fc3"
      language-code="es"
      expand="true"
      style="
        --df-messenger-brand-color: #8E44AD;
        --df-messenger-chat-window-width: 100% !important;
        --df-messenger-chat-window-height: 100%;
        --df-messenger-button-titlebar-color: #f4edf7;
        --df-messenger-shadow-wrapper-background: transparent;
        font-family: 'Roboto', sans-serif !important;
      ">
    </df-messenger>
  </div>

  <script>
    function injectCustomFlexFix() {
      const messenger = document.querySelector('df-messenger');
      const chat = messenger?.shadowRoot?.querySelector('df-messenger-chat');
      const chatShadow = chat?.shadowRoot;

      if (chatShadow && !chatShadow.querySelector('#custom-flex-fix')) {
        const style = document.createElement('style');
        style.id = 'custom-flex-fix';
        style.textContent = `
          .chat-wrapper {
            display: flex !important;
            flex-direction: column !important;
            height: 100% !important;
            max-height: 100% !important;
            box-sizing: border-box !important;
          }
          df-message-list {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            overflow-y: auto !important;
          }
          df-messenger-user-input {
            flex-shrink: 0 !important;
            margin-top: auto !important;
          }
        `;
        chatShadow.appendChild(style);
      }
    }

    window.addEventListener('df-chat-open-changed', function(event) {
      if (event.detail.isOpen) {
        setTimeout(injectCustomFlexFix, 100);
      }
    });

    window.addEventListener('dfMessengerLoaded', function() {
      setTimeout(injectCustomFlexFix, 100);
    });

    // Fallbacks para asegurar inyección en carga inicial con expand="true"
    [100, 300, 600, 1200, 2500].forEach(function(ms) {
      setTimeout(injectCustomFlexFix, ms);
    });
  </script>

</body>
</html>
