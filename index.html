<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecha - Asistente Virtual</title>

  <!-- Script oficial de Dialogflow ES Messenger (CDN Google, sin XSS) -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

  <style>
    /* ─── Reset base ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4edf7;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ─── Marco Global en Pantalla Completa (Full Viewport) ─────────────
       Ocupa el 100% de la ventana de forma absoluta y fija.
       flex + column: cabecera arriba, lista en el medio, footer abajo.
    ──────────────────────────────────────────────────────────────────── */
    .caja-mecha-premium {
      position:       fixed  !important;
      top:            0      !important;
      left:           0      !important;
      width:          100vw  !important;
      height:         100vh  !important;
      margin:         0      !important;
      padding:        0      !important;
      max-width:      none   !important;
      border-radius:  0      !important;
      overflow:       hidden !important;
      z-index:        9999   !important;
      box-shadow:     none   !important;

      /* Estructura columnar: cabecera fija + lista scrollable + footer fijo */
      display:        flex            !important;
      flex-direction: column          !important;
    }

    /* ─── Web Component: ocupa todo el contenedor ───────────────────── */
    df-messenger {
      position: absolute !important;
      inset: 0           !important;
      width:  100%       !important;
      height: 100%       !important;

      /* Forzar también la estructura de columna internamente */
      display:        flex   !important;
      flex-direction: column !important;
      overflow:       hidden !important;

      /* Dimensiones internas del panel del chat */
      --df-messenger-chat-window-width:  100% !important;
      --df-messenger-chat-window-height: 100% !important;

      /* Transparency del wrapper (oculta el background del launcher) */
      --df-messenger-shadow-wrapper-background: transparent;

      /* Color de marca — controla cabecera, chips y acentos */
      --df-messenger-brand-color:                    #8E44AD;

      /* Cabecera */
      --df-messenger-titlebar-background:            #8E44AD;
      --df-messenger-titlebar-font-color:            #ffffff;
      --df-messenger-titlebar-icon-color:            #ffffff;

      /* Burbujas del bot (lila suave, texto oscuro) */
      --df-messenger-message-bot-background:         #f0e5fc;
      --df-messenger-message-bot-font-color:         #2d0052;

      /* Burbujas del usuario (violeta, texto blanco) */
      --df-messenger-message-user-background:        #8E44AD;
      --df-messenger-message-user-font-color:        #ffffff;

      /* Fondo del área de mensajes */
      --df-messenger-chat-background-color:          #faf5ff;

      /* Barra de entrada de texto */
      --df-messenger-input-box-color:                #f3e8ff;
      --df-messenger-input-font-color:               #2d0052;
      --df-messenger-input-placeholder-font-color:   #9b7bb8;

      /* Botón de enviar */
      --df-messenger-send-icon:                      #8E44AD;

      /* Chips / sugerencias rápidas */
      --df-messenger-button-background:              #f0e5fc;
      --df-messenger-button-font-color:              #6C2D9E;
      --df-messenger-button-border:                  1px solid #8E44AD;

      /* Tipografía */
      --df-messenger-font-color:                     #2d0052;
      --df-messenger-font-family:                    'Segoe UI', Arial, sans-serif;
    }

    /* ─── Estilo para ocultar el botón disparador nativo ─────────────── */
    df-messenger >>> .df-messenger-wrapper button#widgetIcon,
    df-messenger::part(launcher),
    df-messenger-chat-bubble,
    df-messenger::part(chat-bubble) {
      display:        none    !important;
      visibility:     hidden  !important;
      opacity:        0       !important;
      pointer-events: none    !important;
      width:          0       !important;
      height:         0       !important;
      overflow:       hidden  !important;
    }

    /* ─── Asegurar que el input de texto ocupe todo el ancho inferior ─ */
    df-messenger >>> df-messenger-user-input,
    df-messenger-user-input::part(input) {
      width: 100% !important;
      max-width: none !important;
    }
    
    df-messenger-chat {
      width: 100% !important;
      height: 100% !important;
    }
    
    /* ─── Saltos de línea para el texto (Ajuste sin tocar JS) ────────── */
    df-messenger >>> .message, 
    df-messenger >>> div.message, 
    df-messenger >>> .text-message, 
    df-messenger >>> df-message, 
    df-messenger::part(message),
    df-messenger >>> .message-text,
    df-messenger >>> df-message-bubble,
    df-messenger >>> .df-message-bubble-content {
      white-space: pre-wrap !important;
      word-break: break-word !important;
    }

    /* ─── (1) Centrado estricto y envoltura de texto en los chips ─────
       Usa las pseudoclases nativas expuestas por Google (::part) para
       llegar a los chips desde fuera del Shadow DOM sin necesitar JS.
    ──────────────────────────────────────────────────────────────────── */
    df-messenger::part(chips) {
      display:         flex   !important;
      flex-wrap:       wrap   !important;
      justify-content: center !important;
      align-items:     center !important;
      text-align:      center !important;
    }

    df-messenger::part(chip) {
      display:         flex   !important;
      justify-content: center !important;
      align-items:     center !important;
      text-align:      center !important;
      white-space:     normal      !important;
      word-break:      break-word  !important;
      max-width:       95%         !important;
      margin:          4px         !important;
    }

    /* ─── (2) Bloqueo de desplazamiento horizontal ────────────────────
       Aísla el ancho de los contenedores de mensajes para que los chips
       dinámicos nunca generen scrollbar horizontal ni muevan el marco.
    ──────────────────────────────────────────────────────────────────── */
    df-messenger::part(list),
    df-messenger::part(chat) {
      overflow-x: hidden !important;
      width:      100%   !important;
      max-width:  100%   !important;
    }

    /* ─── MEDIA QUERIES (Opcional, ya que es Full Screen por defecto) ── */

    @media (max-width: 480px) {
      .caja-mecha-premium {
        height: 100dvh !important; /* Ajuste para barras móviles */
      }
    }
  </style>
</head>
<body>

  <div class="caja-mecha-premium">
    <!--
      inline style repite las variables críticas para máxima especificidad.
      expand="true" = chat abierto desde el inicio, sin click previo.
    -->
    <df-messenger
      intent="WELCOME"
      chat-title="Mecha"
      agent-id="e0dbe63b-3c93-40ad-9c32-efd39b5f4fc3"
      language-code="es"
      expand="true"
      style="
        --df-messenger-brand-color: #8E44AD;
        --df-messenger-chat-window-width: 100% !important;
        --df-messenger-chat-window-height: 100% !important;
        --df-messenger-shadow-wrapper-background: transparent;
      ">
    </df-messenger>
  </div>

  <script>
    (function () {
      var V = { violeta: '#8E44AD', blanco: '#ffffff' };
      var TEXTOS_CHIP_OCULTOS = ['Menú principal'];

      /* CSS Inyectado dinámicamente a través de todas las capas del Shadow DOM */
      var CSS_ESTILOS = [
        '*, *::before, *::after { box-sizing: border-box !important; }',
        ':host {',
        '  --df-messenger-brand-color: ' + V.violeta + ' !important;',
        '  --df-messenger-titlebar-background: ' + V.violeta + ' !important;',
        '  --df-messenger-titlebar-font-color: ' + V.blanco + ' !important;',
        '  --df-messenger-chat-window-width: 100% !important;',
        '  --df-messenger-chat-window-height: 100% !important;',
        '  height: 100vh !important;',
        '  max-height: 100vh !important;',
        '}',

        /* Contenedores del Chat */
        '#df-chat-wrapper, df-messenger-chat, .df-messenger-wrapper, .chat-wrapper, #chat-wrapper, .chat-window, .messenger-container {',
        '  display: flex !important;',
        '  flex-direction: column !important;',
        '  overflow: hidden !important;',
        '  width: 100% !important;',
        '  height: 100% !important;',
        '  max-height: 100vh !important;',
        '  min-height: 0 !important;',
        '  position: relative !important;',
        '  box-shadow: none !important;',
        '  background-color: var(--df-messenger-chat-background-color, #faf5ff) !important;',
        '}',

        /* Cabecera (Titlebar) */
        'df-messenger-titlebar, [part="titlebar"], .df-messenger-titlebar, .title-wrapper, .header {',
        '  background: ' + V.violeta + ' !important;',
        '  background-color: ' + V.violeta + ' !important;',
        '  flex-shrink: 0 !important;',
        '  height: auto !important;',
        '  min-height: 48px !important;',
        '}',
        '.title, [part="title"], df-messenger-titlebar span, h1, h2, .agent-name { color: ' + V.blanco + ' !important; }',
        'df-messenger-titlebar svg path, [part="close-icon"], .material-icons { fill: ' + V.blanco + ' !important; color: ' + V.blanco + ' !important; }',

        /* Lista de Mensajes: Fijada al 100% de altura útil para evitar saltos del input */
        '#messageList, df-message-list, .message-list, .chat-body, .messages-container {',
        '  flex: 1 1 auto !important;',
        '  height: 100% !important;',
        '  min-height: 0 !important;',
        '  overflow-y: auto !important;',
        '  overflow-x: hidden !important;',
        '  width: 100% !important;',
        '  max-width: 100% !important;',
        '  background-color: var(--df-messenger-chat-background-color, #faf5ff) !important;',
        '}',

        /* Formateo de Texto y Saltos de Línea */
        '.message-text, df-message-bubble, .df-message-bubble-content, .message, div.message, .text-message, df-message, [part="message"], .bot-message, .bot-message p, .response-text, span, p {',
        '  white-space: pre-wrap !important;',
        '  word-break: break-word !important;',
        '  line-height: 1.5 !important;',
        '}',

        /* Chips y Sugerencias Rápidas */
        'df-chips, .df-chips, [part="chips"], df-chip, .df-chip, [part="chip"], df-chip button, .df-chip button {',
        '  display: inline-flex !important;',
        '  justify-content: center !important;',
        '  align-items: center !important;',
        '  text-align: center !important;',
        '}',
        'df-chip, .df-chip, [part="chip"], df-chip *, .df-chip * {',
        '  white-space: normal !important;',
        '  word-break: break-word !important;',
        '  max-width: 95% !important;',
        '}',

        /* Entrada de Texto (Input) - Anclada permanentemente al fondo */
        'df-messenger-user-input, .input-area, .user-input-container, .user-input {',
        '  display: block !important;',
        '  flex-shrink: 0 !important;',
        '  margin-top: auto !important;',
        '  height: auto !important;',
        '  min-height: 60px !important;',
        '  width: 100% !important;',
        '  max-width: none !important;',
        '}',
        'df-messenger-input-box, .input-box-wrapper, input[type="text"], textarea { width: 100% !important; max-width: none !important; }',

        /* Ocultar Launcher FAB sobrante */
        'df-messenger-chat-bubble, [part="chat-bubble"], [part="launcher"], button#widgetIcon, button.df-messenger-chat-bubble, .df-messenger-chat-bubble, df-messenger-button, button[class*="bubble"], button[class*="launcher"], button[class*="widget"] {',
        '  display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; width: 0 !important; height: 0 !important; overflow: hidden !important;',
        '}'
      ].join('\n');

      function inyectarEstilos(shadowRoot, id) {
        if (!shadowRoot || shadowRoot.querySelector('#' + id)) return;
        var style = document.createElement('style');
        style.id = id;
        style.textContent = CSS_ESTILOS;
        try { shadowRoot.appendChild(style); } catch (e) {}
      }

      function ocultarChipsPorTexto(root) {
        if (!root || !root.querySelectorAll) return;
        var sels = ['df-chip', '.df-chip', '[part="chip"]', 'button[class*="chip"]'];
        sels.forEach(function (sel) {
          try {
            root.querySelectorAll(sel).forEach(function (el) {
              var texto = (el.textContent || '').trim();
              if (TEXTOS_CHIP_OCULTOS.indexOf(texto) !== -1) {
                el.style.cssText = 'display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;margin:0!important;overflow:hidden!important;';
              }
            });
          } catch (e) {}
        });
      }

      var shadowsObservados = new WeakSet();
      function observarShadow(root) {
        if (!root || shadowsObservados.has(root)) return;
        shadowsObservados.add(root);
        try {
          new MutationObserver(aplicarTodo).observe(root, { childList: true, subtree: true });
        } catch (e) {}
      }

      function aplicarTodo() {
        var df = document.querySelector('df-messenger');
        if (!df || !df.shadowRoot) return;

        inyectarEstilos(df.shadowRoot, 'mecha-style-n1');
        ocultarChipsPorTexto(df.shadowRoot);
        observarShadow(df.shadowRoot);

        var dfChat = df.shadowRoot.querySelector('df-messenger-chat');
        if (!dfChat || !dfChat.shadowRoot) return;

        inyectarEstilos(dfChat.shadowRoot, 'mecha-style-n2');
        ocultarChipsPorTexto(dfChat.shadowRoot);
        observarShadow(dfChat.shadowRoot);

        var dfMsgList = dfChat.shadowRoot.querySelector('df-message-list');
        if (dfMsgList && dfMsgList.shadowRoot) {
          inyectarEstilos(dfMsgList.shadowRoot, 'mecha-style-msglist');
          ocultarChipsPorTexto(dfMsgList.shadowRoot);
          observarShadow(dfMsgList.shadowRoot);

          dfMsgList.shadowRoot.querySelectorAll('df-message-bubble').forEach(function (bubble, i) {
            if (bubble.shadowRoot) {
              inyectarEstilos(bubble.shadowRoot, 'mecha-style-bubble-' + i);
              ocultarChipsPorTexto(bubble.shadowRoot);
              observarShadow(bubble.shadowRoot);
            }
          });
        }

        var dfTitle = dfChat.shadowRoot.querySelector('df-messenger-titlebar');
        if (dfTitle && dfTitle.shadowRoot) {
          inyectarEstilos(dfTitle.shadowRoot, 'mecha-style-title');
          observarShadow(dfTitle.shadowRoot);
        }

        var dfInput = dfChat.shadowRoot.querySelector('df-messenger-user-input');
        if (dfInput && dfInput.shadowRoot) {
          observarShadow(dfInput.shadowRoot);
        }
      }

      window.addEventListener('dfMessengerLoaded', aplicarTodo);
      [100, 300, 600, 1200, 2500].forEach(function (delay) {
        setTimeout(aplicarTodo, delay);
      });

      new MutationObserver(aplicarTodo).observe(document.body, { childList: true, subtree: true });
    })();
  </script>

</body>
</html>
